name: Build RestrictedShell (fixed)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86, x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
          host_arch: x64
      - name: Build
        shell: cmd
        run: |
          if not exist "bin\${{ matrix.arch }}" mkdir "bin\${{ matrix.arch }}"
          cd src
          call build-one.bat ${{ matrix.arch }} "..\bin\${{ matrix.arch }}\RestrictedShell.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: RestrictedShell-${{ matrix.arch }}
          path: bin/${{ matrix.arch }}/RestrictedShell.exe

  package:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: RestrictedShell-*
          path: package/bin
      - name: Assemble package
        shell: powershell
        run: |
          Copy-Item RestrictedShellSetup.ps1 package/
          Copy-Item RestrictedShell.ini package/
          Copy-Item README.md package/
      - uses: actions/upload-artifact@v4
        with:
          name: RestrictedShell-bundle
          path: package
