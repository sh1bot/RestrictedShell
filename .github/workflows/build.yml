name: Build RestrictedShell

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86, x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Build
        shell: cmd
        run: |
          if not exist "bin\${{ matrix.arch }}" mkdir "bin\${{ matrix.arch }}"
          cd src
          call build-one.bat ${{ matrix.arch }} "..\bin\${{ matrix.arch }}\RestrictedShell.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: RestrictedShell-${{ matrix.arch }}
          path: bin/${{ matrix.arch }}/RestrictedShell.exe

  package:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/bin/x86,package/bin/x64,package/bin/arm64 | Out-Null
          Copy-Item artifacts/RestrictedShell-x86/RestrictedShell.exe package/bin/x86/
          Copy-Item artifacts/RestrictedShell-x64/RestrictedShell.exe package/bin/x64/
          Copy-Item artifacts/RestrictedShell-arm64/RestrictedShell.exe package/bin/arm64/
          Copy-Item RestrictedShellSetup.ps1,RestrictedShell.ini,README.md package/
          Compress-Archive package/* RestrictedShell.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RestrictedShell-bundle
          path: RestrictedShell.zip
