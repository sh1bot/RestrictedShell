name: Build RestrictedShell

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - output: x86
            vcvars: x64_x86
          - output: x64
            vcvars: x64
          - output: arm64
            vcvars: x64_arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS=%%I"
          if not defined VS exit /b 1
          call "%VS%\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvars }}
          if errorlevel 1 exit /b %errorlevel%
          if not exist "bin\${{ matrix.output }}" mkdir "bin\${{ matrix.output }}"
          cd src
          call build-one.bat ${{ matrix.output }} "..\bin\${{ matrix.output }}\RestrictedShell.exe"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RestrictedShell-${{ matrix.output }}
          path: bin/${{ matrix.output }}/RestrictedShell.exe

  package:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Validate PowerShell scripts
        shell: powershell
        run: |
          $files = @((Resolve-Path 'RestrictedShellSetup.ps1'))
          $files += Get-ChildItem scripts -Filter *.ps1 -File | ForEach-Object { $_.FullName }

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error "$file : $($_.Message)" }
              exit 1
            }
          }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\InitializeAudioVolumes.ps1 -ValidateOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/bin/x86,package/bin/x64,package/bin/arm64 | Out-Null
          Copy-Item artifacts/RestrictedShell-x86/RestrictedShell.exe package/bin/x86/
          Copy-Item artifacts/RestrictedShell-x64/RestrictedShell.exe package/bin/x64/
          Copy-Item artifacts/RestrictedShell-arm64/RestrictedShell.exe package/bin/arm64/
          Copy-Item RestrictedShellSetup.ps1,RestrictedShell.ini,README.md package/
          Copy-Item scripts package/scripts -Recurse
          Compress-Archive package/* RestrictedShell.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RestrictedShell-bundle
          path: RestrictedShell.zip

  publish:
    needs: package
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # This job deliberately does not check out or execute repository code.
      # It only downloads the already-built package and publishes it.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: RestrictedShell-bundle
          path: publish

      - name: Publish versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag publish/RestrictedShell.zip --repo '${{ github.repository }}' --clobber
          }
          else {
            gh release create $tag publish/RestrictedShell.zip --repo '${{ github.repository }}' --generate-notes
          }

      - name: Publish moving latest build
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo '${{ github.repository }}' --cleanup-tag --yes 2>$null
          if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0 }
          gh release create latest publish/RestrictedShell.zip --repo '${{ github.repository }}' --target '${{ github.sha }}' --title 'Latest build' --notes 'Automated build of the latest source on main. This prerelease is replaced on every successful main-branch build.' --prerelease
