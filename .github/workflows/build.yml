name: Build RestrictedShell

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - output: x86
            vcvars: x64_x86
          - output: x64
            vcvars: x64
          - output: arm64
            vcvars: x64_arm64
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vcvars }}
      - name: Build
        shell: cmd
        run: |
          if not exist "bin\${{ matrix.output }}" mkdir "bin\${{ matrix.output }}"
          cd src
          call build-one.bat ${{ matrix.output }} "..\bin\${{ matrix.output }}\RestrictedShell.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: RestrictedShell-${{ matrix.output }}
          path: bin/${{ matrix.output }}/RestrictedShell.exe

  package:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/bin/x86,package/bin/x64,package/bin/arm64 | Out-Null
          Copy-Item artifacts/RestrictedShell-x86/RestrictedShell.exe package/bin/x86/
          Copy-Item artifacts/RestrictedShell-x64/RestrictedShell.exe package/bin/x64/
          Copy-Item artifacts/RestrictedShell-arm64/RestrictedShell.exe package/bin/arm64/
          Copy-Item RestrictedShellSetup.ps1,RestrictedShell.ini,README.md package/
          Compress-Archive package/* RestrictedShell.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RestrictedShell-bundle
          path: RestrictedShell.zip

      - name: Publish versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RestrictedShell.zip
          generate_release_notes: true

      - name: Publish moving latest build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "${{ github.repository }}" --cleanup-tag --yes 2>$null
          if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0 }
          gh release create latest RestrictedShell.zip --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Latest build" --notes "Automated build of the latest source on main. This prerelease is replaced on every successful main-branch build." --prerelease
